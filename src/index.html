<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>keepMeUpdated</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Developer news that matters, gathered every morning and summarized." />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f4f5f7" />
    <script>
      // Apply the saved theme before first paint so dark readers don't see a light flash.
      try {
        document.documentElement.dataset.theme = localStorage.getItem('kmu.theme') === 'dark' ? 'dark' : 'light';
      } catch (e) {
        document.documentElement.dataset.theme = 'light';
      }
    </script>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&family=JetBrains+Mono:wght@400..600&display=swap"
    />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
